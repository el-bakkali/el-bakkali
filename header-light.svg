<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Mehdi El Bakkali</title>
  <desc id="dsc">Senior Escalation Engineer and Security Consultant. Open-source tools for Azure monitoring, edge security and IoT.</desc>

  <style>
    .bg   { fill: #F7F2E8; }
    .ink  { fill: #12233A; }
    .mut  { fill: #5A6B80; }
    .maj  { stroke: #3B4CC0; }
    .saf  { stroke: #C98A2E; }
    .tea  { stroke: #14807C; }
    .ter  { stroke: #BC5334; }
    .dot  { fill: #C98A2E; }
    .rule { stroke: #3B4CC0; opacity: .50; }
    .geo  { fill: none; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
    .name { font-family: 'Optima','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
            font-size: 46px; font-weight: 600; letter-spacing: 5px; }
    .role { font-family: 'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
            font-size: 21px; letter-spacing: 1.4px; }
    .meta { font-family: 'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
            font-size: 15px; letter-spacing: 2.8px; }
  </style>

  <defs>
    <!-- Khatim / rub el hizb: the union of two squares rotated 45 degrees. -->
    <polygon id="k" points="0,-60 17.57,-42.43 42.43,-42.43 42.43,-17.57 60,0 42.43,17.57
                            42.43,42.43 17.57,42.43 0,60 -17.57,42.43 -42.43,42.43 -42.43,17.57
                            -60,0 -42.43,-17.57 -42.43,-42.43 -17.57,-42.43"/>

    <pattern id="zellige" width="88" height="88" patternUnits="userSpaceOnUse">
      <g class="geo maj">
        <use href="#k" transform="translate(44,44) scale(.2)"/>
        <use href="#k" transform="translate(0,0) scale(.2)"/>
        <use href="#k" transform="translate(88,0) scale(.2)"/>
        <use href="#k" transform="translate(0,88) scale(.2)"/>
        <use href="#k" transform="translate(88,88) scale(.2)"/>
        <rect x="22" y="22" width="44" height="44" transform="rotate(45 44 44)"/>
      </g>
    </pattern>

    <linearGradient id="vign" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade"><rect width="1200" height="320" fill="url(#vign)"/></mask>
  </defs>

  <rect class="bg" width="1200" height="320"/>
  <g mask="url(#fade)"><rect width="1200" height="320" fill="url(#zellige)"/></g>

  <rect class="geo maj" x="10" y="10" width="1180" height="300" opacity=".30"/>
  <g class="geo saf" opacity=".60">
    <use href="#k" transform="translate(10,10) scale(.14)"/>
    <use href="#k" transform="translate(1190,10) scale(.14)"/>
    <use href="#k" transform="translate(10,310) scale(.14)"/>
    <use href="#k" transform="translate(1190,310) scale(.14)"/>
  </g>

  <g transform="translate(168,160)">
    <circle class="geo maj" r="118" opacity=".35"/>
    <circle class="geo saf" r="110" opacity=".70"/>
    <use class="geo maj" href="#k" transform="scale(1.65)"/>
    <use class="geo tea" href="#k" transform="scale(1.65) rotate(22.5)"/>
    <g class="geo maj" opacity=".45">
      <path d="M0,-99 V-62 M0,99 V62 M-99,0 H-62 M99,0 H62"/>
      <path d="M-70,-70 L-44,-44 M70,-70 L44,-44 M-70,70 L-44,44 M70,70 L44,44"/>
    </g>
    <circle class="geo maj" r="62" opacity=".75"/>
    <use class="geo saf" href="#k" transform="scale(.78)"/>
    <use class="geo ter" href="#k" transform="scale(.78) rotate(22.5)" opacity=".85"/>
    <circle class="dot" r="7"/>
  </g>

  <path class="geo maj" d="M310,52 V268" opacity=".40"/>
  <use class="geo saf" href="#k" transform="translate(310,160) scale(.17)"/>

  <text class="name ink" x="358" y="136">MEHDI EL BAKKALI</text>
  <path class="geo rule" d="M360,166 H1120"/>
  <text class="role ink" x="360" y="204" opacity=".90">Senior Escalation Engineer &#183; Security Consultant</text>
  <text class="meta mut" x="360" y="240">AZURE MONITORING &#183; EDGE SECURITY &#183; IOT</text>
</svg>
